[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "property-graph-markdown"
version = "0.4.0a1"
description = "Reference parser and validator for the Property Graph Markdown 0.4.0 Public Draft"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "markdown-it-py>=4.0.0,<5",
  "ruamel.yaml>=0.18.6,<0.19",
  "jsonschema>=4.23.0,<5",
]

[project.urls]
Homepage = "https://github.com/property-graph-markdown/specification"
Repository = "https://github.com/property-graph-markdown/specification.git"
Issues = "https://github.com/property-graph-markdown/specification/issues"

[project.scripts]
pgmark = "pgmark:main"

[tool.setuptools]
package-dir = { "" = "parser" }
py-modules = ["canonical", "pgmark", "validation"]
