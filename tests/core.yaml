cases:
  - name: OKF Concept becomes Node with complete Properties
    markdown: |
      ---
      type: Person
      name: Alice
      age: 42
      ---
    conceptId: people/Alice
    graphElementType: Person
    nodeProperties: {type: Person, name: Alice, age: 42}

  - name: bare Concept Link is baseline Relationship
    markdown: |
      [Acme](Acme.md)
    relationship:
      type: null
      properties: {}

  - name: untyped Relationship with Properties
    markdown: |
      [Acme](Acme.md "{since: 2024}")
    relationship:
      type: null
      properties: {since: 2024}

  - name: typed Relationship retains type Property
    markdown: |
      [Acme](Acme.md "{type: works_for}")
    relationship:
      type: works_for
      properties: {type: works_for}

  - name: typed Relationship with Properties
    markdown: |
      [Acme](Acme.md "{type: works_for, since: 2024}")
    relationship:
      type: works_for
      properties: {type: works_for, since: 2024}

  - name: ordinary Markdown title preserves baseline Relationship
    markdown: |
      [Acme](Acme.md "Acme Corporation")
    relationship:
      type: null
      properties: {}
      title: Acme Corporation

  - name: empty YAML Flow Map equals bare Relationship
    markdown: |
      [Acme](Acme.md "{}")
    relationship:
      type: null
      properties: {}

  - name: YAML scalar sequence and mapping values
    markdown: |
      [Acme](Acme.md "{type: works_for, text: hello, count: 2, ratio: 0.5, active: true, roles: [architect, developer], context: {team: graph}}")
    relationshipProperties:
      type: works_for
      text: hello
      count: 2
      ratio: 0.5
      active: true
      roles: [architect, developer]
      context: {team: graph}

  - name: invalid YAML Flow Map candidate is nonfatal
    markdown: |
      [Acme](Acme.md "{type:")
    relationship:
      type: null
      properties: {}
    warnings: true

  - name: relative OKF Concept Link
    source: people/Alice
    markdown: |
      [Acme](../organizations/Acme.md)
    target: organizations/Acme

  - name: absolute OKF Concept Link
    source: people/Alice
    markdown: |
      [Acme](/organizations/Acme.md)
    target: organizations/Acme

  - name: external Link is not a Concept Link
    markdown: |
      [website](https://example.com)
    relationships: []

  - name: wikilink is outside the reference Markdown profile
    markdown: |
      [[Acme]]
    relationships: []
