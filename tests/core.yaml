cases:
  - name: node label
    markdown: |
      [:Person]()
    labels: [Person]
    nodeProperties: {}
    relationships: []

  - name: node label and properties
    markdown: |
      [:Person {name: "Ada", born: 1815}]()
    labels: [Person]
    nodeProperties: {name: Ada, born: 1815}

  - name: multiple node annotations
    markdown: |
      [:Person {name: "Ada"}]()
      [:Mathematician {born: 1815}]()
    labels: [Person, Mathematician]
    nodeProperties: {name: Ada, born: 1815}

  - name: outgoing relationship
    markdown: |
      [:knows](bob.md)
    relationships:
      - source: alice.md
        type: knows
        target: bob.md

  - name: relationship properties
    markdown: |
      [:approvedBy {date: 2026-06-26, confidence: 0.98}](peter.md)
    relationshipProperties:
      date: 2026-06-26
      confidence: 0.98

  - name: exact duplicate relationship
    markdown: |
      [:visited {year: 1830}](London.md)
      [:visited {year: 1830}](London.md)
    relationshipCount: 1

  - name: same endpoints with different properties
    markdown: |
      [:visited {year: 1830}](London.md)
      [:visited {year: 1831}](London.md)
    relationshipCount: 2

  - name: ordinary empty link
    markdown: |
      [coming soon]()
    labels: []
    relationships: []

  - name: wikilink compatibility is non-semantic
    markdown: |
      [[London | :BORN_IN {year: 1815}]]
    relationships: []

  - name: frontmatter ignored
    markdown: |
      ---
      labels: [Person]
      properties: {born: 1815}
      ---
    labels: []
    nodeProperties: {}

  - name: malformed annotation
    markdown: |
      [:approvedBy {date](target.md)
    warnings: true
